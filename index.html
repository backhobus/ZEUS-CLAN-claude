<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEUS CLAN · 가입 신청</title>
<link rel="icon" type="image/png" href="ZEUSweb.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=Orbitron:wght@800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#06080e;--panel:rgba(18,22,36,.78);--gold:#e9c46a;--gold2:#f6dc9b;--line:rgba(233,196,106,.38);--tx:#eef0f5;--mut:#9aa3b5;--err:#ff6b6b;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#1d2a4d 0,#0b1022 45%,var(--bg) 80%);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance;line-height:1.55}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 15%,rgba(255,214,80,.28),transparent 55%);opacity:0;animation:flash 5s infinite}
@keyframes flash{0%,88%,94%,100%{opacity:0}90%{opacity:1}92%{opacity:.3}93%{opacity:.9}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 16px;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.view{display:none;animation:in .35s ease}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.hero{text-align:center;margin-bottom:18px}
.logo{width:140px;height:140px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 0 5px rgba(233,196,106,.1),0 0 30px rgba(233,196,106,.22)}
.since{font:700 14px Cinzel,serif;letter-spacing:.38em;color:var(--gold);margin:12px 0 4px}
h1{font:800 clamp(24px,8vw,48px) Orbitron,'Noto Sans KR',sans-serif;letter-spacing:.04em;line-height:1.15;margin:0;color:#f4ecd2;text-shadow:0 0 16px rgba(255,208,100,.4),0 0 35px rgba(255,190,60,.2)}
.tag{margin:10px auto 0;font-size:13.5px;color:#b9c6ea;padding:6px 16px;border:1px solid rgba(150,170,230,.35);border-radius:999px;display:inline-block;background:rgba(120,140,220,.08)}.tag .y{color:#f5cf55;font-weight:700}.tag .p{color:#b98cff;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:98px;padding:12px;border-radius:16px;border:1.5px solid var(--cb);background:var(--cg);color:#f6ecc8;font:700 16px 'Noto Sans KR',sans-serif;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;--cb:#5d5632;--cg:linear-gradient(135deg,#1d1c17,#101317);--gl:rgba(233,196,106,.28)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.card svg{width:24px;height:24px;flex:none}
.card .arr{color:#b9964a;font-size:20px;transition:transform .3s ease}
.card.main{grid-column:1/-1;min-height:120px;font-size:20px;--cb:#e1c04f;--cg:linear-gradient(90deg,#4a3a14,#13110c 50%,#4a3a14);--gl:rgba(225,192,79,.35)}
.card.dc{--cb:#3f4aa0;--cg:linear-gradient(135deg,#1f2550,#0e1124);--gl:rgba(125,135,255,.35)}
.card .ic{color:#f2cf5a}.card.dc .ic{color:#8f95ff}
@keyframes sheen{to{transform:translateX(120%)}}
@keyframes wob{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg) scale(1.15)}70%{transform:rotate(8deg) scale(1.1)}}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 8px 28px var(--gl);border-color:#fff3c4}.card:hover::after{animation:sheen .8s ease}.card:hover .ic{animation:wob .6s ease}.card:hover .arr{transform:translateX(6px)}}
.card:active,.card.tap{transform:scale(.97);box-shadow:0 0 26px var(--gl);border-color:#fff3c4}
.card.tap::after{animation:sheen .6s ease}.card.tap .ic{animation:wob .5s ease}.card.tap .arr{transform:translateX(6px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px;backdrop-filter:blur(6px)}
.step{font:500 12px Cinzel,serif;letter-spacing:.2em;color:var(--gold);margin-bottom:6px}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:6px;margin-bottom:16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b98a2e,var(--gold),#fff1c4);border-radius:6px;box-shadow:0 0 12px rgba(233,196,106,.6);transition:width .7s cubic-bezier(.22,1,.36,1)}
#stage>*{animation:in .35s ease both}
h2{font-size:18px;line-height:1.4;margin:0 0 14px}
input[type=text],textarea{width:100%;padding:12px 14px;font:inherit;font-size:16px;color:var(--tx);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);border-radius:10px;outline:0}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,196,106,.18)}
::placeholder{color:rgba(255,255,255,.3);opacity:1}
.err{color:var(--err);font-size:13px;margin:8px 2px 0;min-height:18px;visibility:hidden}.err.on{visibility:visible}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{padding:14px;font:700 16px 'Noto Sans KR',sans-serif;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--tx);cursor:pointer}
.yn button.sel{background:var(--gold);color:#1a1305;border-color:var(--gold)}
.nav{display:grid;grid-template-columns:1fr 9fr;gap:10px;margin-top:16px}
.nav.one{grid-template-columns:1fr}
.b{padding:14px 8px;font:700 16px 'Noto Sans KR',sans-serif;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--gold2);cursor:pointer}
.b.go{background:linear-gradient(135deg,#f6dc9b,#e9c46a 55%,#c9973a);color:#1a1305;border:0}
.b:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.row:last-child{border:0}.row div{min-width:0;flex:1}
.row span{display:block;font-size:12px;color:var(--gold);margin-bottom:2px}
.row p{margin:0;white-space:pre-wrap;word-break:break-word}
.edit{flex:none;padding:6px 12px;font:500 13px 'Noto Sans KR',sans-serif;border-radius:8px;border:1px solid var(--line);background:none;color:var(--gold2);cursor:pointer}
.done{text-align:center;padding:36px 10px}
.done h2{font-size:22px;color:var(--gold2)}.done p{color:var(--mut);margin:0}
.bolt{font-size:40px}

/* 수정된 명예의 전당 그리드 및 이미지 스타일 */
.hall{display:grid;grid-template-columns:repeat(2, 1fr);gap:12px}.hall img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid var(--line)}

.empty{text-align:center;color:var(--mut);padding:24px 0;font-size:15px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top h2{margin:0}
.admin{margin-top:14px;font-size:13px;color:var(--mut)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none;user-drag:none}
.foot{margin-top:auto;padding-top:12px;text-align:center;font:500 12px Cinzel,serif;letter-spacing:.2em;color:rgba(185,198,234,.55)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fx svg{position:absolute;inset:0;width:100%;height:100%}
.halo{position:absolute;left:50%;top:150px;width:560px;height:560px;max-width:140vw;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,200,60,.34),rgba(255,170,0,.1) 42%,transparent 68%)}
@keyframes pulse{50%{opacity:.5;transform:translate(-50%,-50%) scale(1.14)}}
.bolt{fill:none;stroke:#ffd54a;stroke-width:5;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:0;filter:drop-shadow(0 0 6px #ffcf3a) drop-shadow(0 0 16px #ffb300)}
.b1{animation:zap 4s infinite .5s}.b2{animation:zap 5s infinite 2s}.b3{animation:zap 6s infinite 3.5s}
@keyframes zap{0%,91%,100%{opacity:0}92%{opacity:1}93%{opacity:.15}94%{opacity:1}97%{opacity:0}}
.wrap{position:relative;z-index:1}
@keyframes glow{0%,100%{box-shadow:0 0 0 6px rgba(233,196,106,.1),0 0 40px rgba(233,196,106,.28)}50%{box-shadow:0 0 0 8px rgba(255,208,80,.18),0 0 70px rgba(255,200,60,.6)}}
@media(prefers-reduced-motion:reduce){.fx *,.logo{animation:none!important}}
@media(min-width:900px){
.wrap{max-width:1120px;padding:48px 40px 24px}
.hero{display:flex;align-items:center;justify-content:center;gap:60px;text-align:left;margin-bottom:40px}
.hero .logo{width:220px;height:220px;flex:none}
.hero .since{margin:0 0 10px;font-size:18px}
h1{font-size:68px;letter-spacing:.05em}
.tag{margin-top:16px;font-size:17px;padding:8px 20px}
.grid{gap:20px}
.card{min-height:140px;font-size:20px;border-radius:20px}
.card.main{min-height:180px;font-size:26px}
.card svg{width:32px;height:32px}.card .arr{font-size:28px}
.view:not(#home){width:100%;max-width:780px;margin:0 auto}
.panel{padding:32px 36px}
h2{font-size:24px}
.halo{width:900px;height:900px;top:260px}
}
.bw{display:none}
@media(min-width:900px){
.bw{display:block}
.b4{animation:zap 4.5s infinite 1.5s}.b5{animation:zap 5.5s infinite 3s}.b6{animation:zap 6.5s infinite 0s}.b7{animation:zap 5s infinite 2.5s}
.wrap{max-width:1180px}
#home.on{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;align-content:center;flex:1}
.hero{display:block;text-align:center;margin:0}
.hero .logo{width:240px;height:240px}
.hero .since{margin:16px 0 8px}
h1{font-size:50px}
.tag{margin-top:12px;font-size:15px}
.card.main{min-height:190px}
}
@media(min-width:900px){
.halo{display:none}
body{overflow-x:clip}
.hero{position:relative}
.hero::before{content:"";position:absolute;left:50%;top:130px;width:780px;height:780px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,200,60,.42),rgba(255,170,0,.12) 42%,transparent 68%);pointer-events:none;z-index:-1}
body::before{background:radial-gradient(circle at 27% 34%,rgba(255,214,80,.3),transparent 45%)}
}
body.calm::before,.calm .fx{display:none}
@media(max-width:899px){
.bw{display:block}
.b1{animation:zap 3s infinite .3s}.b2{animation:zap 3.6s infinite 1.4s}.b3{animation:zap 4.2s infinite 2.2s}
.b4{animation:zap 3.3s infinite 0s}.b5{animation:zap 3.9s infinite 1s}.b6{animation:zap 4.4s infinite 2.6s}.b7{animation:zap 3.5s infinite 1.9s}
.b8{animation:zap 4.8s infinite .8s}.b9{animation:zap 4.1s infinite 3s}.b10{animation:zap 5s infinite 2s}.b11{animation:zap 3.7s infinite 3.4s}
}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
body::before{display:none!important}


/* 모바일: 화면별 중앙 정렬, 하단 문구 보호, 키보드가 열린 경우에만 스크롤 */
@media(max-width:899px){
  html,body{width:100%;height:100%;overflow:hidden}
  body{min-height:0;overscroll-behavior:none}
  .wrap{
    height:var(--mobile-viewport-height,100dvh);
    min-height:0;
    padding:max(8px,env(safe-area-inset-top,0px)) 14px max(12px,env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    overflow:hidden;
    overscroll-behavior:none;
  }
  .view{width:100%}
  .view.on{
    display:flex;
    flex:0 0 auto;
    flex-direction:column;
    justify-content:center;
    width:100%;
    min-height:0;
    margin-block:auto;
  }
  #brandPanel .hero{margin-bottom:clamp(7px,1.4dvh,12px)}
  .logo{width:clamp(88px,16dvh,120px);height:clamp(88px,16dvh,120px)}
  .since{font-size:12px;margin:7px 0 3px;letter-spacing:.32em}
  h1{font-size:clamp(25px,6.5vw,38px);line-height:1.1}
  .tag{font-size:clamp(10px,2.8vw,12px);margin-top:6px;padding:4px 10px}
  .grid{gap:clamp(6px,1.2dvh,9px)}
  .card{min-height:clamp(66px,11dvh,88px);padding:8px;gap:7px;border-radius:12px;font-size:14px}
  .card.main{min-height:clamp(82px,13dvh,100px);font-size:17px}
  .card svg{width:20px;height:20px}
  .card .arr{font-size:17px}
  .foot{
    flex:0 0 auto;
    margin-top:0;
    padding:8px 0 2px;
    min-height:22px;
    font-size:clamp(8px,2.6vw,10px);
    line-height:1.2;
    letter-spacing:clamp(.08em,.35vw,.16em);
    white-space:nowrap;
  }
  .panel{width:100%;padding:14px 12px}
  .step{font-size:11px;margin-bottom:4px}
  .bar{height:5px;margin-bottom:10px}
  h2{font-size:16px;line-height:1.35;margin-bottom:10px}
  input[type=text],textarea{padding:10px 12px}
  textarea{min-height:90px}
  .nav{margin-top:10px;gap:8px}
  .b{padding:11px 8px;font-size:14px}
  .yn{gap:8px}
  .yn button{padding:11px;font-size:14px}
  .done{padding:24px 8px}
  .done h2{font-size:20px}
  .row{padding:7px 0}
  .empty{padding:14px 0}
  .hall{gap:8px}

  /* 키보드가 열리면 보이는 화면에 래퍼를 맞추고, 박스 전체가 함께 이동하도록 한다. */
  body.keyboard-open .wrap{
    position:fixed;
    left:0;
    right:0;
    top:var(--visual-viewport-top,0px);
    height:var(--mobile-viewport-height,100dvh);
    overflow-x:hidden;
    overflow-y:auto;
    padding-top:max(6px,env(safe-area-inset-top,0px));
    padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
  }
  body.keyboard-open .view.on{margin-block:0;min-height:100%;}
  body.keyboard-open #form.view.on{padding:32vh 0;min-height:calc(100% + 64vh);}
  body.keyboard-open .foot{display:none}
}

/* 높이가 짧은 휴대폰에서는 첫 화면 소개 영역을 가로형으로 배치 */
@media(max-width:899px) and (max-height:620px){
  .wrap{padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
  #brandPanel .hero{
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    align-items:center;
    gap:12px;
    text-align:left;
    margin-bottom:8px;
  }
  #brandPanel .hero .logo{width:clamp(70px,14dvh,92px);height:clamp(70px,14dvh,92px)}
  #brandPanel .hero .since{font-size:11px;margin:0 0 4px}
  #brandPanel .hero h1{font-size:clamp(24px,5.5vw,32px)}
  #brandPanel .hero .tag{margin:5px 0 0;padding:3px 8px;font-size:10px}
  #home .card{min-height:clamp(58px,10dvh,68px)}
  #home .card.main{min-height:clamp(72px,12dvh,82px)}
}


/* 데스크톱: 좌측 브랜드 영역은 고정하고 우측 콘텐츠만 전환 */
@media(min-width:900px){
  .wrap{height:100vh;min-height:100vh;display:flex;flex-direction:column}
  .desktop-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:center;
    gap:56px;
    flex:1 1 auto;
    min-height:0;
    width:100%;
  }
  .brand-panel{display:flex;align-items:center;justify-content:center;min-width:0}
  .brand-panel .hero{display:block;width:100%;text-align:center;margin:0}
  .brand-panel .hero .logo{width:240px;height:240px}
  .brand-panel .hero .since{margin:16px 0 8px}
  .brand-panel .hero h1{font-size:50px}
  .brand-panel .hero .tag{margin-top:12px;font-size:15px}
  .right-panel{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0;
    width:100%;
    height:100%;
    overflow:hidden;
  }
  .right-panel .view{width:100%;max-width:650px;margin:0 auto}
  .right-panel #home.view.on{display:block;width:100%;max-width:650px}
  .right-panel .view:not(#home){max-height:86vh;overflow-y:auto;overscroll-behavior:contain}
  .right-panel #form.view:not(.on),.right-panel #hallV.view:not(.on),.right-panel #doneV.view:not(.on){display:none}
  .right-panel #form .panel,.right-panel #hallV .panel,.right-panel #doneV .panel{width:100%}
  .right-panel #hallV .hall{max-height:62vh;overflow-y:auto}
}

/* 모바일: 브랜드 영역은 메인 화면에서만 기존처럼 보이고, 절차 화면은 전체 너비 사용 */
@media(max-width:899px){
  .desktop-layout{display:flex;flex:1 0 auto;flex-direction:column;min-height:0;width:100%;overflow:visible}
  .brand-panel{display:none;flex:0 0 auto;min-width:0}
  body.home-state .brand-panel{display:block}
  .brand-panel .hero{text-align:center;margin-bottom:clamp(7px,1.4dvh,12px)}
  .right-panel{display:flex;flex:1 0 auto;flex-direction:column;align-items:stretch;justify-content:center;min-height:0;width:100%;overflow:visible}
  #home.view.on{display:flex;flex:1 0 auto;justify-content:center;width:100%;margin-block:auto}
  #home .grid{width:100%}
  .right-panel .view:not(#home){width:100%;max-width:none;margin-block:auto}
}

#brandTag{transition:opacity .5s ease,transform .5s ease}
#brandTag.tag-fade{opacity:0;transform:translateY(5px)}
@media(prefers-reduced-motion:reduce){#brandTag{transition:none}}

</style>
</head>
<body class="home-state">
<div class="fx" aria-hidden="true"><div class="halo"></div>
<canvas id="bolt"></canvas></div>
<div class="wrap">

<div class="desktop-layout" id="desktopLayout">

// 모바일 가상 키보드가 열린 동안에만 화면 스크롤을 허용하고,
// 포커스된 입력란을 실제로 보이는 화면의 가운데에 배치합니다.
(function setupMobileKeyboard(){
  const mobileQuery=matchMedia('(max-width:899px)');
  const viewport=window.visualViewport;
  let baseHeight=viewport?viewport.height:window.innerHeight;
  let focusedField=null;
  let keyboardDetected=false;
  let focusStartedAt=0;
  let centerTimer=0;

  const isField=el=>!!(el&&el.matches&&el.matches('input,textarea'));
  const wrap=()=>document.querySelector('.wrap');

  function applyViewport(height,offsetTop=0){
    document.documentElement.style.setProperty('--mobile-viewport-height',Math.max(1,Math.round(height))+'px');
    document.documentElement.style.setProperty('--visual-viewport-top',Math.max(0,Math.round(offsetTop))+'px');
  }

  function centerField(el){
    if(!mobileQuery.matches||!isField(el)||document.activeElement!==el||!document.body.classList.contains('keyboard-open'))return;
    const container=wrap();
    if(!container)return;
    const rect=el.getBoundingClientRect();
    const visibleTop=viewport?viewport.offsetTop:0;
    const visibleHeight=viewport?viewport.height:window.innerHeight;
    const visibleCenter=visibleTop+visibleHeight/2;
    const fieldCenter=rect.top+rect.height/2;
    const offset=fieldCenter-visibleCenter;
    if(Math.abs(offset)>8)container.scrollBy({top:offset,behavior:'smooth'});
  }

  function scheduleCenter(el,delay=120){
    clearTimeout(centerTimer);
    centerTimer=setTimeout(()=>centerField(el),delay);
  }

  function updateViewport(){
    if(!mobileQuery.matches){
      document.body.classList.remove('keyboard-open');
      return;
    }
    const height=viewport?viewport.height:window.innerHeight;
    const offsetTop=viewport?viewport.offsetTop:0;
    const active=isField(document.activeElement)&&document.activeElement===focusedField;

    if(!active){
      if(document.body.classList.contains('keyboard-open')){
        // 포커스가 사라진 뒤 키보드가 닫히는 중이면 실제 화면이 복원될 때까지 감지한다.
        if(height>=baseHeight-70){
          document.body.classList.remove('keyboard-open');
          keyboardDetected=false;
          baseHeight=height;
          applyViewport(height,0);
          const container=wrap();
          if(container)container.scrollTo({top:0,behavior:'smooth'});
        }else{
          applyViewport(height,offsetTop);
        }
      }else{
        baseHeight=height;
        applyViewport(height,0);
      }
      return;
    }

    const reduction=baseHeight-height;
    if(reduction>100){
      keyboardDetected=true;
      document.body.classList.add('keyboard-open');
      applyViewport(height,offsetTop);
      scheduleCenter(focusedField,100);
    }else if(keyboardDetected&&reduction<70){
      // 키보드를 닫았지만 입력란의 포커스는 남아 있는 경우
      keyboardDetected=false;
      document.body.classList.remove('keyboard-open');
      baseHeight=height;
      applyViewport(height,0);
      const container=wrap();
      if(container)container.scrollTo({top:0,behavior:'smooth'});
    }else if(Date.now()-focusStartedAt<1000){
      // 키보드 애니메이션 중 스크롤 영역을 먼저 열어 둔다.
      document.body.classList.add('keyboard-open');
      applyViewport(height,offsetTop);
    }else{
      applyViewport(height,offsetTop);
    }
  }

  document.addEventListener('focusin',event=>{
    if(!mobileQuery.matches||!isField(event.target))return;
    focusedField=event.target;
    focusStartedAt=Date.now();
    keyboardDetected=false;
    document.body.classList.add('keyboard-open');
    const height=viewport?viewport.height:window.innerHeight;
    const offsetTop=viewport?viewport.offsetTop:0;
    applyViewport(height,offsetTop);
    scheduleCenter(focusedField,420);
  });

  document.addEventListener('focusout',event=>{
    if(!isField(event.target))return;
    setTimeout(()=>{
      if(!isField(document.activeElement)){
        focusedField=null;
        keyboardDetected=false;
        const height=viewport?viewport.height:window.innerHeight;
        baseHeight=Math.max(baseHeight,height);
        document.body.classList.remove('keyboard-open');
        applyViewport(height,0);
        const container=wrap();
        if(container)container.scrollTo({top:0,behavior:'smooth'});
      }
    },240);
  });

  if(viewport)viewport.addEventListener('resize',updateViewport);
  if(viewport)viewport.addEventListener('scroll',updateViewport);
  window.addEventListener('resize',updateViewport);
  mobileQuery.addEventListener?.('change',updateViewport);
  applyViewport(viewport?viewport.height:window.innerHeight,0);
  updateViewport();
})();

}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uidOk=v=>/^[0-9A-Z]{15,16}$/.test(v)&&!v.includes('O');

function step(i){
  cur=i;const q=Q[i];
  let f;
  if(q.t==='yn')f=`<div class="yn"><button data-v="예">예</button><button data-v="아니요">아니요</button></div>`;
  else if(q.t==='area')f=`<textarea id="f" ${q.sm?'style="min-height:84px"':''} ${q.ph?`placeholder="${esc(q.ph)}"`:''}></textarea>`;
  else f=`<input type="text" id="f" autocomplete="off" ${q.ph?`placeholder="${esc(q.ph)}"`:''}>`;
  $('stepL').textContent='STEP '+(i+1)+' / 5';setBar(i*25);$('stage').innerHTML=`
   <h2>${q.q}</h2>${f}<p class="err" id="err"></p>
   <div class="nav"><button class="b" id="prev">이전</button><button class="b go" id="next">다음</button></div>`;
  const err=$('err'),hide=()=>err.classList.remove('on');
  const f1=$('f');
  const read=()=>{if(f1)A[q.k]=q.sm?f1.value.replace(/\s*\n\s*/g,' ').trim():f1.value.trim()};
  
  if(f1){
    f1.value=A[q.k]||'';
    ['focus','input'].forEach(e=>f1.addEventListener(e,()=>{hide();read();}));
    f1.addEventListener('keydown',(e)=>{
      if(e.key==='Enter'){
        if(q.t==='area'){
          if(e.ctrlKey||e.metaKey){
            e.preventDefault();
            read();
            $('next').click();
          }
        }else{
          e.preventDefault();
          read();
          $('next').click();
        }
      }
    });
  }
  document.querySelectorAll('.yn button').forEach(b=>{
    if(A[q.k]===b.dataset.v)b.classList.add('sel');
    b.onclick=()=>{A[q.k]=b.dataset.v;document.querySelectorAll('.yn button').forEach(x=>x.classList.toggle('sel',x===b));hide()}});
  $('prev').onclick=()=>{read();if(fromConfirm){fromConfirm=false;confirmV()}else if(i===0){show('home');setBar(0)}else step(i-1)};
  $('next').onclick=()=>{
    read();const v=A[q.k]||'';
    if(!v){err.textContent='답변을 입력해 주세요.';err.classList.add('on');return}
    if(q.k==='uid'&&!uidOk(v)){err.textContent='게임 UID를 다시 확인해주세요.';err.classList.add('on');return}
    if(fromConfirm){fromConfirm=false;confirmV()}else if(i<4)step(i+1);else confirmV();
  };
  show('form');if(f1&&q.t!=='area')setTimeout(()=>f1.focus({preventScroll:true}),50);
}
function confirmV(){
  $('stepL').textContent='FINAL CHECK';setBar(100);$('stage').innerHTML=`<h2>마지막으로 확인해주세요.</h2>
  ${Q.map((q,i)=>`<div class="row"><div><span>${q.l}</span><p>${esc(A[q.k])}</p></div><button class="edit" data-i="${i}">수정</button></div>`).join('')}
  <p class="err" id="err"></p><div class="nav one"><button class="b go" id="send">가입 신청하기</button></div>`;
  document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>{fromConfirm=true;step(+b.dataset.i)});
  $('send').onclick=submit;show('form');
}
async function submit(){
  const btn=$('send'),err=$('err');btn.disabled=true;err.classList.remove('on');
  const kst=new Date(Date.now()+9*36e5).toISOString().replace('T',' ').slice(0,19);
  const rec={submittedAt:kst,nick:A.nick,uid:A.uid,age:A.age,why:A.why,tour:A.tour};
  let ok=false;
  if(CFG.endpoint){try{await fetch(CFG.endpoint,{method:'POST',mode:'no-cors',body:JSON.stringify(rec)});ok=true}catch(e){}}
  if(ok)show('doneV');else{btn.disabled=false;err.textContent='전송에 실패했어요. 잠시 후 다시 시도해 주세요.';err.classList.add('on')}
}
async function hall(){
  show('hallV');const box=$('hallList');
  box.innerHTML='<div class="empty">기록을 불러오는 중...</div>';
  let ids=[];
  if(CFG.endpoint){
    try{
      const r=await fetch(CFG.endpoint+'?action=hall');
      const j=await r.json();
      if(j.error||!Array.isArray(j.images)){
        box.innerHTML='<div class="empty">기록을 불러오지 못했습니다.</div>';
        return;
      }
      ids=j.images;
    }catch(e){
      box.innerHTML='<div class="empty">기록을 불러오지 못했습니다.</div>';
      return;
    }
  }else if(Array.isArray(CFG.hallImages)){
    ids=CFG.hallImages;
  }
  
  if(ids.length===0){
    box.innerHTML='<div class="empty">등록된 기록이 없습니다.</div>';
  }else{
    box.innerHTML=ids.map(s=>`<img loading="lazy" draggable="false" alt="명예의 전당" src="${esc(s)}">`).join('');
  }
}
const tapFx=el=>{el.classList.add('tap');setTimeout(()=>el.classList.remove('tap'),600)};
document.querySelectorAll('.card').forEach(c=>c.addEventListener('pointerdown',()=>tapFx(c)));
const later=fn=>()=>setTimeout(fn,matchMedia('(hover:none)').matches?220:0);
$('goForm').onclick=later(()=>{fromConfirm=false;step(0)});
$('goHall').onclick=later(hall);
['contextmenu','selectstart','dragstart'].forEach(t=>document.addEventListener(t,e=>{if(!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault()}));$('hallBack').onclick=()=>show('home');

(function(){
  const cv=document.getElementById('bolt'),cx=cv.getContext('2d');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  let W,H;
  const fit=()=>{const D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)};
  fit();addEventListener('resize',fit);
  const path=(x1,y1,x2,y2,off)=>{let p=[[x1,y1],[x2,y2]];for(;off>2;off/=2){const q=[p[0]];for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i];q.push([(a[0]+b[0])/2+(Math.random()-.5)*off,(a[1]+b[1])/2+(Math.random()-.5)*off*.35],b)}p=q}return p};
  function make(){
    const x=Math.random()*W,ex=x+(Math.random()-.5)*W*.25,ey=H*(.45+Math.random()*.5);
    const main=path(x,0,ex,ey,Math.min(W,260)*.55),br=[];
    for(let i=8;i<main.length-8;i++)if(Math.random()<.04){
      const b=main[i],d=Math.random()<.5?-1:1,len=H*(.08+Math.random()*.2);
      br.push(path(b[0],b[1],b[0]+d*len*(.5+Math.random()),b[1]+len,len*.5));
    }
    return {lines:[main,...br]};
  }
  function draw(s,a){
    cx.lineJoin='round';cx.lineCap='round';
    s.lines.forEach((l,k)=>{
      [[k?3:7,'rgba(255,190,40,'+.35*a+')',30],[k?1.6:3.2,'rgba(255,230,120,'+.8*a+')',14],[k?.8:1.6,'rgba(255,255,245,'+a+')',6]].forEach(([w,c,bl])=>{
        cx.beginPath();l.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));
        cx.strokeStyle=c;cx.lineWidth=w;cx.shadowColor='#ffc83c';cx.shadowBlur=bl;cx.stroke();
      });
    });
    cx.shadowBlur=0;
  }
  const prof=[1,.12,.9,.25,.7,.45,.3,.18,.1,.05];
  let live=[];
  function frame(now){
    cx.clearRect(0,0,W,H);
    live=live.filter(o=>{
      const k=Math.floor((now-o.t)/45);if(k<0)return true;if(k>=prof.length)return false;
      const a=prof[k];cx.fillStyle='rgba(255,215,90,'+a*.1+')';cx.fillRect(0,0,W,H);draw(o.s,a);return true;
    });
    requestAnimationFrame(frame);
  }
  function strike(){
    if(!document.hidden&&!document.body.classList.contains('calm')){
      const n=Math.random()<.25?2:1,t=performance.now();
      for(let i=0;i<n;i++)live.push({s:make(),t:t+i*90});
    }
    const m=W<900;setTimeout(strike,(m?500:800)+Math.random()*(m?1100:1400));
  }
  strike();requestAnimationFrame(frame);
})();
</script>
</body>
