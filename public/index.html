<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=Orbitron:wght@800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#06080e;--panel:rgba(18,22,36,.78);--gold:#e9c46a;--gold2:#f6dc9b;--line:rgba(233,196,106,.38);--tx:#eef0f5;--mut:#9aa3b5;--err:#ff6b6b;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#1d2a4d 0,#0b1022 45%,var(--bg) 80%);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance;line-height:1.55}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 15%,rgba(255,214,80,.28),transparent 55%);opacity:0;animation:flash 5s infinite}
@keyframes flash{0%,88%,94%,100%{opacity:0}90%{opacity:1}92%{opacity:.3}93%{opacity:.9}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 16px;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.view{display:none;animation:in .35s ease}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.hero{text-align:center;margin-bottom:18px}
.logo{width:140px;height:140px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 0 5px rgba(233,196,106,.1),0 0 30px rgba(233,196,106,.22)}
.since{font:700 14px Cinzel,serif;letter-spacing:.38em;color:var(--gold);margin:12px 0 4px}
h1{font:800 clamp(24px,8vw,48px) Orbitron,'Noto Sans KR',sans-serif;letter-spacing:.04em;line-height:1.15;margin:0;color:#f4ecd2;text-shadow:0 0 16px rgba(255,208,100,.4),0 0 35px rgba(255,190,60,.2)}
.tag{margin:10px auto 0;font-size:13.5px;color:#b9c6ea;padding:6px 16px;border:1px solid rgba(150,170,230,.35);border-radius:999px;display:inline-block;background:rgba(120,140,220,.08)}.tag .y{color:#f5cf55;font-weight:700}.tag .p{color:#b98cff;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:98px;padding:12px;border-radius:16px;border:1.5px solid var(--cb);background:var(--cg);color:#f6ecc8;font:700 16px 'Noto Sans KR',sans-serif;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;--cb:#5d5632;--cg:linear-gradient(135deg,#1d1c17,#101317);--gl:rgba(233,196,106,.28)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.card svg{width:24px;height:24px;flex:none}
.card .arr{color:#b9964a;font-size:20px;transition:transform .3s ease}
.card.main{grid-column:1/-1;min-height:120px;font-size:20px;--cb:#e1c04f;--cg:linear-gradient(90deg,#4a3a14,#13110c 50%,#4a3a14);--gl:rgba(225,192,79,.35)}
.card.dc{--cb:#3f4aa0;--cg:linear-gradient(135deg,#1f2550,#0e1124);--gl:rgba(125,135,255,.35)}
.card .ic{color:#f2cf5a}.card.dc .ic{color:#8f95ff}
@keyframes sheen{to{transform:translateX(120%)}}
@keyframes wob{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg) scale(1.15)}70%{transform:rotate(8deg) scale(1.1)}}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 8px 28px var(--gl);border-color:#fff3c4}.card:hover::after{animation:sheen .8s ease}.card:hover .ic{animation:wob .6s ease}.card:hover .arr{transform:translateX(6px)}}
.card:active,.card.tap{transform:scale(.97);box-shadow:0 0 26px var(--gl);border-color:#fff3c4}
.card.tap::after{animation:sheen .6s ease}.card.tap .ic{animation:wob .5s ease}.card.tap .arr{transform:translateX(6px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px;backdrop-filter:blur(6px)}
.privacy-note{margin:0 0 16px;padding:10px 12px;border:1px solid rgba(233,196,106,.18);border-radius:9px;background:rgba(0,0,0,.16);color:var(--mut);font-size:12px;line-height:1.65;word-break:keep-all}
.step{font:500 12px Cinzel,serif;letter-spacing:.2em;color:var(--gold);margin-bottom:6px}

    <a class="card dc" href="https://discord.gg/Bd79ZUXdm2" target="_blank" rel="noopener noreferrer"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5.2 5.6C7.1 4.5 9.4 4 12 4s4.9.5 6.8 1.6c1.9 3 2.8 6.2 2.9 10.4-1.5 1.5-3.4 2.4-5.4 3l-1-1.7c-1.1.3-2.2.4-3.3.4s-2.2-.1-3.3-.4l-1 1.7c-2-.6-3.9-1.5-5.4-3 .1-4.2 1-7.4 2.9-10.4z"/><circle cx="8.8" cy="12.3" r="1.7" fill="#0e1124"/><circle cx="15.2" cy="12.3" r="1.7" fill="#0e1124"/></svg>공식 디스코드</a>

<script>
const CFG={
  applyUrl:"/api/apply",
  hallUrl:"/api/hall",
  hallImages:[]
};
const Q=[
 {k:'nick',l:'닉네임',q:'게임에서 사용하는 닉네임을 알려주세요.',t:'text'},
 {k:'uid',l:'게임 UID',q:'게임 UID를 알려주세요.',t:'text',ph:'예: 428BCBA023C04781'},
 {k:'age',l:'연령대',q:'연령대를 알려주세요.',t:'area',sm:1,ph:'가입 절차를 위해서만 사용되며, 외부로 공유되지 않습니다.'},
 {k:'why',l:'가입 사유',q:'ZEUS에 가입하고 싶은 사유를 알려주세요.',t:'area'},
 {k:'tour',l:'토너먼트 의향',q:'디스코드에 참가하여 토너먼트에 도전할 의향이 있나요?',t:'yn'}
];
const $=id=>document.getElementById(id);
const brandLogoEl=$('brandLogo'),doneLogoEl=$('doneLogo');
if(brandLogoEl&&doneLogoEl)doneLogoEl.src=brandLogoEl.src;
const A={};let cur=0,fromConfirm=false,brandTagTimer=0;
const setBar=p=>requestAnimationFrame(()=>{$('barI').style.width=p+'%'});

// 모바일 가상 키보드가 열린 동안에만 화면 스크롤을 허용하고,
// 포커스된 입력란을 실제로 보이는 화면의 가운데에 배치합니다.
(function setupMobileKeyboard(){
  const mobileQuery=matchMedia('(max-width:899px)');
  const viewport=window.visualViewport;
  let baseHeight=viewport?viewport.height:window.innerHeight;
  let focusedField=null;
  let keyboardDetected=false;
  let focusStartedAt=0;
  let centerTimer=0;

  const isField=el=>!!(el&&el.matches&&el.matches('input,textarea'));
  const wrap=()=>document.querySelector('.wrap');

  function applyViewport(height,offsetTop=0){
    document.documentElement.style.setProperty('--mobile-viewport-height',Math.max(1,Math.round(height))+'px');
    document.documentElement.style.setProperty('--visual-viewport-top',Math.max(0,Math.round(offsetTop))+'px');
  }

  function centerField(el){
    if(!mobileQuery.matches||!isField(el)||document.activeElement!==el||!document.body.classList.contains('keyboard-open'))return;
    const container=wrap();
    if(!container)return;
    const rect=el.getBoundingClientRect();
    const visibleTop=viewport?viewport.offsetTop:0;
    const visibleHeight=viewport?viewport.height:window.innerHeight;
    const visibleCenter=visibleTop+visibleHeight/2;
    const fieldCenter=rect.top+rect.height/2;
    const offset=fieldCenter-visibleCenter;
    if(Math.abs(offset)>8)container.scrollBy({top:offset,behavior:'smooth'});
  }

  function scheduleCenter(el,delay=120){
    clearTimeout(centerTimer);
    centerTimer=setTimeout(()=>centerField(el),delay);
  }

  function updateViewport(){
    if(!mobileQuery.matches){
      document.body.classList.remove('keyboard-open');
      return;
    }
    const height=viewport?viewport.height:window.innerHeight;
    const offsetTop=viewport?viewport.offsetTop:0;
    const active=isField(document.activeElement)&&document.activeElement===focusedField;

    if(!active){
      if(document.body.classList.contains('keyboard-open')){
        // 포커스가 사라진 뒤 키보드가 닫히는 중이면 실제 화면이 복원될 때까지 감지한다.
        if(height>=baseHeight-70){
          document.body.classList.remove('keyboard-open');
          keyboardDetected=false;
          baseHeight=height;
          applyViewport(height,0);
          const container=wrap();
          if(container)container.scrollTo({top:0,behavior:'smooth'});
        }else{
          applyViewport(height,offsetTop);
        }
      }else{
        baseHeight=height;
        applyViewport(height,0);
      }
      return;
    }

    const reduction=baseHeight-height;
    if(reduction>100){
      keyboardDetected=true;
      document.body.classList.add('keyboard-open');
      applyViewport(height,offsetTop);
      scheduleCenter(focusedField,100);
    }else if(keyboardDetected&&reduction<70){
      // 키보드를 닫았지만 입력란의 포커스는 남아 있는 경우
      keyboardDetected=false;
      document.body.classList.remove('keyboard-open');
      baseHeight=height;
      applyViewport(height,0);
      const container=wrap();
      if(container)container.scrollTo({top:0,behavior:'smooth'});
    }else if(Date.now()-focusStartedAt<1000){
      // 키보드 애니메이션 중 스크롤 영역을 먼저 열어 둔다.
      document.body.classList.add('keyboard-open');
      applyViewport(height,offsetTop);
    }else{
      applyViewport(height,offsetTop);
    }
  }

  document.addEventListener('focusin',event=>{
    if(!mobileQuery.matches||!isField(event.target))return;
    focusedField=event.target;
    focusStartedAt=Date.now();
    keyboardDetected=false;
    document.body.classList.add('keyboard-open');
    const height=viewport?viewport.height:window.innerHeight;
    const offsetTop=viewport?viewport.offsetTop:0;
    applyViewport(height,offsetTop);
    scheduleCenter(focusedField,420);
  });

  document.addEventListener('focusout',event=>{
    if(!isField(event.target))return;
    setTimeout(()=>{
      if(!isField(document.activeElement)){
        focusedField=null;
        keyboardDetected=false;
        const height=viewport?viewport.height:window.innerHeight;
        baseHeight=Math.max(baseHeight,height);
        document.body.classList.remove('keyboard-open');
        applyViewport(height,0);
        const container=wrap();
        if(container)container.scrollTo({top:0,behavior:'smooth'});
      }
    },240);
  });

  if(viewport)viewport.addEventListener('resize',updateViewport);
  if(viewport)viewport.addEventListener('scroll',updateViewport);
  window.addEventListener('resize',updateViewport);
  mobileQuery.addEventListener?.('change',updateViewport);
  applyViewport(viewport?viewport.height:window.innerHeight,0);
  updateViewport();
})();

function updateBrandTag(isContentView){
  const tag=$('brandTag');
  if(!tag)return;
  const nextMode=isContentView?'content':'home';
  if(tag.dataset.mode===nextMode)return;
  tag.dataset.mode=nextMode;
  clearTimeout(brandTagTimer);
  const nextHtml=isContentView
    ? 'WHERE YOUR LEGEND BEGINS'
    : '<span class="y">영웅</span>, <span class="p">전설</span> 타이틀 누적 299개 배출';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    tag.innerHTML=nextHtml;
    tag.classList.remove('tag-fade');
    return;
  }
  tag.classList.add('tag-fade');
  brandTagTimer=setTimeout(()=>{
    tag.innerHTML=nextHtml;
    tag.classList.remove('tag-fade');
  },500);
}

function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));
  const isHome=id==='home';
  const isContentView=!isHome;
  document.body.classList.toggle('home-state',isHome);
  document.body.classList.toggle('calm',id==='form'||id==='hallV'||id==='doneV');
  updateBrandTag(isContentView);
  const wrap=document.querySelector('.wrap');
  if(wrap)wrap.scrollTop=0;
  scrollTo(0,0);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uidOk=v=>/^[0-9A-Z]{15,16}$/.test(v)&&!v.includes('O');

function step(i){
  cur=i;const q=Q[i];
  let f;
  if(q.t==='yn')f=`<div class="yn"><button data-v="예">예</button><button data-v="아니요">아니요</button></div>`;
  else if(q.t==='area')f=`<textarea id="f" ${q.sm?'style="min-height:84px"':''} ${q.ph?`placeholder="${esc(q.ph)}"`:''}></textarea>`;
  else f=`<input type="text" id="f" autocomplete="off" ${q.ph?`placeholder="${esc(q.ph)}"`:''}>`;
  $('stepL').textContent='STEP '+(i+1)+' / 5';setBar(i*25);$('stage').innerHTML=`
   <h2>${q.q}</h2>${f}<p class="err" id="err"></p>
   <div class="nav"><button class="b" id="prev">이전</button><button class="b go" id="next">다음</button></div>`;
  const err=$('err'),hide=()=>err.classList.remove('on');
  const f1=$('f');
  const read=()=>{if(f1){const value=q.sm?f1.value.replace(/\s*\n\s*/g,' ').trim():f1.value.trim();A[q.k]=q.k==='uid'?value.toUpperCase():value}};
  
  if(f1){
    f1.value=A[q.k]||'';
    if(q.k==='uid'){
      f1.value=f1.value.toUpperCase();
      A.uid=f1.value;
      f1.addEventListener('input',()=>{
        const cursor=f1.selectionStart;
        const upper=f1.value.toUpperCase();
        if(f1.value!==upper){
          f1.value=upper;
          if(cursor!==null)f1.setSelectionRange(cursor,cursor);
        }
      });
    }
    ['focus','input'].forEach(e=>f1.addEventListener(e,()=>{hide();read();}));
    f1.addEventListener('keydown',(e)=>{
      if(e.key==='Enter'){
        if(q.t==='area'){
          if(e.ctrlKey||e.metaKey){
            e.preventDefault();
            read();
            $('next').click();
          }
        }else{
          e.preventDefault();
          read();
          $('next').click();
        }
      }
    });
  }
  document.querySelectorAll('.yn button').forEach(b=>{
    if(A[q.k]===b.dataset.v)b.classList.add('sel');
    b.onclick=()=>{A[q.k]=b.dataset.v;document.querySelectorAll('.yn button').forEach(x=>x.classList.toggle('sel',x===b));hide()}});
  $('prev').onclick=()=>{read();if(fromConfirm){fromConfirm=false;confirmV()}else if(i===0){show('home');setBar(0)}else step(i-1)};
  $('next').onclick=()=>{
    read();const v=A[q.k]||'';
    if(!v){err.textContent='답변을 입력해 주세요.';err.classList.add('on');return}
    if(q.k==='uid'&&!uidOk(v)){err.textContent='게임 UID를 다시 확인해주세요.';err.classList.add('on');return}
    if(fromConfirm){fromConfirm=false;confirmV()}else if(i<4)step(i+1);else confirmV();
  };
  show('form');if(f1&&q.t!=='area')setTimeout(()=>f1.focus({preventScroll:true}),50);
}
function confirmV(){
  $('stepL').textContent='FINAL CHECK';setBar(100);$('stage').innerHTML=`<h2>마지막으로 확인해주세요.</h2>
  ${Q.map((q,i)=>`<div class="row"><div><span>${q.l}</span><p>${esc(A[q.k])}</p></div><button class="edit" data-i="${i}">수정</button></div>`).join('')}
  <p class="privacy-note">중복 신청 및 부정 이용 방지를 위해 IP 주소, 운영체제(OS), 브라우저가 제공하는 기종 정보가 수집되어 가입 신청 관리에 이용됩니다. 기종 정보는 브라우저 환경에 따라 확인되지 않을 수 있습니다.</p>
  <p class="err" id="err"></p><div class="nav one"><button class="b go" id="send">가입 신청하기</button></div>`;
  document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>{fromConfirm=true;step(+b.dataset.i)});
  $('send').onclick=submit;show('form');
}
function detectOsFromUserAgent(ua){
  if(/iPhone|iPad|iPod/i.test(ua))return /iPad/i.test(ua)?'iPadOS':'iOS';
  if(/Android/i.test(ua))return 'Android';
  if(/Windows NT/i.test(ua))return 'Windows';
  if(/Mac OS X|Macintosh/i.test(ua))return 'macOS';
  if(/Linux/i.test(ua))return 'Linux';
  return '확인 불가';
}
async function collectDeviceInfo(){
  const ua=navigator.userAgent||'';
  let os=detectOsFromUserAgent(ua);
  let deviceModel='기종 확인 불가';
  try{
    if(navigator.userAgentData&&typeof navigator.userAgentData.getHighEntropyValues==='function'){
      const hints=await navigator.userAgentData.getHighEntropyValues(['platform','platformVersion','model']);
      if(hints.platform){
        os=String(hints.platform)+(hints.platformVersion?' '+String(hints.platformVersion):'');
      }
      if(hints.model&&String(hints.model).trim())deviceModel=String(hints.model).trim();
    }
  }catch(e){}
  return {os:String(os).slice(0,100),deviceModel:String(deviceModel).slice(0,100)};
}
async function submit(){
  const btn=$('send'),err=$('err');btn.disabled=true;err.classList.remove('on');
  try{
    const device=await collectDeviceInfo();
    const rec={nick:A.nick,uid:A.uid,age:A.age,why:A.why,tour:A.tour,...device};
    const response=await fetch(CFG.applyUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(rec)
    });
    let result={};
    try{result=await response.json()}catch(e){}
    if(!response.ok||!result.ok){
      const messages={
        IP_MISSING:'IP 주소를 확인할 수 없어 가입 신청을 접수할 수 없습니다.',
        COUNTRY_NOT_ALLOWED:'대한민국에서 접속한 경우에만 가입 신청을 할 수 있습니다.',
        IP_BLOCKED:'현재 네트워크에서는 가입 신청을 할 수 없습니다.',
        INVALID:'입력 내용을 확인한 뒤 다시 신청해 주세요.',
        SERVICE_NOT_CONFIGURED:'서버 설정이 완료되지 않았습니다. 관리자에게 문의해 주세요.',
        UPSTREAM_ERROR:'신청 정보를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.'
      };
      throw new Error(messages[result.code]||'전송에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    }
    show('doneV');
  }catch(e){
    btn.disabled=false;
    err.textContent=e&&e.message?e.message:'전송에 실패했습니다. 잠시 후 다시 시도해 주세요.';
    err.classList.add('on');
  }
}
async function hall(){
  show('hallV');const box=$('hallList');
  box.innerHTML='<div class="empty">기록을 불러오는 중...</div>';
  let ids=[];
  try{
    const r=await fetch(CFG.hallUrl,{method:'GET',cache:'no-store'});
    const j=await r.json();
    if(!r.ok||j.error||!Array.isArray(j.images)){
      box.innerHTML='<div class="empty">기록을 불러오지 못했습니다.</div>';
      return;
    }
    ids=j.images;
  }catch(e){
    box.innerHTML='<div class="empty">기록을 불러오지 못했습니다.</div>';
    return;
  }
  if(ids.length===0){
    box.innerHTML='<div class="empty">등록된 기록이 없습니다.</div>';
  }else{
    box.innerHTML=ids.map(s=>`<img loading="lazy" draggable="false" alt="명예의 전당" src="${esc(s)}">`).join('');
  }
}
const tapFx=el=>{el.classList.add('tap');setTimeout(()=>el.classList.remove('tap'),600)};
document.querySelectorAll('.card').forEach(c=>c.addEventListener('pointerdown',()=>tapFx(c)));
const later=fn=>()=>setTimeout(fn,matchMedia('(hover:none)').matches?220:0);
$('goForm').onclick=later(()=>{fromConfirm=false;step(0)});
$('goHall').onclick=later(hall);
['contextmenu','selectstart','dragstart'].forEach(t=>document.addEventListener(t,e=>{if(!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault()}));$('hallBack').onclick=()=>show('home');$('doneBack').onclick=()=>{fromConfirm=false;setBar(0);show('home')};

(function(){
  const cv=document.getElementById('bolt'),cx=cv.getContext('2d');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  let W,H;
  const fit=()=>{const D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)};
  fit();addEventListener('resize',fit);
  const path=(x1,y1,x2,y2,off)=>{let p=[[x1,y1],[x2,y2]];for(;off>2;off/=2){const q=[p[0]];for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i];q.push([(a[0]+b[0])/2+(Math.random()-.5)*off,(a[1]+b[1])/2+(Math.random()-.5)*off*.35],b)}p=q}return p};
  function make(){
    const x=Math.random()*W,ex=x+(Math.random()-.5)*W*.25,ey=H*(.45+Math.random()*.5);
    const main=path(x,0,ex,ey,Math.min(W,260)*.55),br=[];
    for(let i=8;i<main.length-8;i++)if(Math.random()<.04){
      const b=main[i],d=Math.random()<.5?-1:1,len=H*(.08+Math.random()*.2);
      br.push(path(b[0],b[1],b[0]+d*len*(.5+Math.random()),b[1]+len,len*.5));
    }
    return {lines:[main,...br]};
  }
  function draw(s,a){
    cx.lineJoin='round';cx.lineCap='round';
    s.lines.forEach((l,k)=>{
      [[k?3:7,'rgba(255,190,40,'+.35*a+')',30],[k?1.6:3.2,'rgba(255,230,120,'+.8*a+')',14],[k?.8:1.6,'rgba(255,255,245,'+a+')',6]].forEach(([w,c,bl])=>{
        cx.beginPath();l.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));
        cx.strokeStyle=c;cx.lineWidth=w;cx.shadowColor='#ffc83c';cx.shadowBlur=bl;cx.stroke();
      });
    });
    cx.shadowBlur=0;
  }
  const prof=[1,.12,.9,.25,.7,.45,.3,.18,.1,.05];
  let live=[];
  function frame(now){
    cx.clearRect(0,0,W,H);
    live=live.filter(o=>{
      const k=Math.floor((now-o.t)/45);if(k<0)return true;if(k>=prof.length)return false;
      const a=prof[k];cx.fillStyle='rgba(255,215,90,'+a*.1+')';cx.fillRect(0,0,W,H);draw(o.s,a);return true;
    });
    requestAnimationFrame(frame);
  }
  function strike(){
    if(!document.hidden&&!document.body.classList.contains('calm')){
      const n=Math.random()<.25?2:1,t=performance.now();
      for(let i=0;i<n;i++)live.push({s:make(),t:t+i*90});
    }
    const m=W<900;setTimeout(strike,(m?500:800)+Math.random()*(m?1100:1400));
  }
  strike();requestAnimationFrame(frame);
})();
</script>
